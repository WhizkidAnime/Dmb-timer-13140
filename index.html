<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ДМБ</title>
<meta name="description" content="Таймер до дембеля: сколько осталось, армейские даты и свои события">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ДМБ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --fg:#000000; --mute:#707070; --line:#e4e4e4; --cell:#ebebeb; --soft:#f4f4f4; --scrim:rgba(0,0,0,.4);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --text:"Onest",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mute:#8c8c8c;--line:#262626;--cell:#1d1d1d;--soft:#111;--scrim:rgba(0,0,0,.65);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mute:#8c8c8c;--line:#262626;--cell:#1d1d1d;--soft:#111;--scrim:rgba(0,0,0,.65);color-scheme:dark}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.muted{color:var(--mute)}

.app{position:relative;height:100%;min-height:500px;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 8px}
.mark{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em}
.tools{display:flex;gap:4px}
.tb{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;transition:border-color .2s,transform .15s}
.tb:hover{border-color:var(--fg)}
.tb:active,.btn:active{transform:scale(.96)}

main{flex:1;min-height:0;position:relative}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px 20px 100px;overflow-y:auto;overscroll-behavior:contain}
.panel[hidden]{display:none}
.ptitle{font-size:22px;font-weight:600;margin:4px 0 14px;flex:none}

/* Таймер */
#p-timer{gap:14px}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.big{font-family:var(--display);font-weight:700;line-height:.9;letter-spacing:-.03em;
  font-size:min(9rem, 19vh, calc(min(92vw,520px) / (var(--len,3) * .86)));
  background:none;border:0;padding:0;cursor:pointer;display:block;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.cap{font-size:19px;font-weight:500;margin-top:12px}
.clock{font-size:19px;color:var(--mute);font-variant-numeric:tabular-nums;min-height:1.45em}

.seg{position:relative;display:flex;width:100%;border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.seg .pill{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:var(--fg);transition:transform .38s var(--ease),width .38s var(--ease)}
.seg button{position:relative;z-index:1;flex:1 1 0;min-width:0;background:none;border:0;border-radius:999px;padding:7px 2px;font-size:14px;cursor:pointer;color:var(--mute);transition:color .3s;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--bg)}
@media (max-width:380px){.seg button{font-size:13px}}

.nextcard{flex:none;display:block;width:100%;text-align:left;background:var(--soft);border:0;border-radius:14px;padding:12px 16px;cursor:pointer}
.nextcard small{display:block;color:var(--mute);font-size:13px;margin-bottom:2px}
.nextcard .nrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.nextcard strong{font-weight:600;min-width:0}
.nextcard .r{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px;flex:none}

.prog{flex:none}
.pct{font-family:var(--display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums;margin-bottom:10px;letter-spacing:-.02em}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:8px;font-size:14px}

/* События */
#p-events{overflow:hidden}
.chips{display:flex;gap:6px;overflow-x:auto;flex:none;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;transition:background-color .25s,color .25s,border-color .25s}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pastbtn{flex:none;align-self:flex-start;background:none;border:0;padding:8px 0 4px;color:var(--mute);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -20px;padding:0 20px}
ol.tl{list-style:none;margin:0;padding:0}
.tl li{border-top:1px solid var(--line)}
.tl li:last-child{border-bottom:1px solid var(--line)}
.tl li.in{animation:rise .38s var(--ease) both}
.tl button.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;padding:11px 0;cursor:pointer}
.tl .t{font-weight:500}
.tl .d{font-size:13px;color:var(--mute);grid-column:1}
.tl .s{grid-row:1/span 2;grid-column:2;align-self:center;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.tl li.past .t,.tl li.past .s{color:var(--mute)}
.tl li.next .s{font-weight:600}
.tl li.flash{animation:flash 1.4s var(--ease)}
.empty{color:var(--mute);font-size:15px;padding:16px 0;line-height:1.5}

.btn{border:0;background:var(--fg);color:var(--bg);border-radius:999px;padding:12px 20px;font-weight:500;cursor:pointer;font-size:15px;transition:transform .15s}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.wide{width:100%;flex:none;margin-top:12px}
input[type=text],input[type=date]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;width:100%;min-width:0}

/* Нижнее меню: плавающая стеклянная капсула */
:root{--glass:rgba(255,255,255,.58);--glass-edge:rgba(0,0,0,.09);--glass-hi:rgba(255,255,255,.85);--glass-sel:rgba(0,0,0,.09);--glass-shadow:rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(44,44,46,.5);--glass-edge:rgba(255,255,255,.14);--glass-hi:rgba(255,255,255,.22);--glass-sel:rgba(255,255,255,.15);--glass-shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--glass:rgba(44,44,46,.5);--glass-edge:rgba(255,255,255,.14);--glass-hi:rgba(255,255,255,.22);--glass-sel:rgba(255,255,255,.15);--glass-shadow:rgba(0,0,0,.5)}
nav.tabs{position:absolute;left:14px;right:14px;bottom:10px;z-index:5;display:flex;padding:6px;border-radius:999px;
  background:var(--bg);border:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px var(--glass-shadow)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  nav.tabs{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
}
nav.tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 2);border-radius:999px;background:var(--glass-sel);
  box-shadow:inset 0 0 0 1px var(--glass-edge);transition:transform .45s var(--ease)}
nav.tabs button{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:8px 0 7px;font-size:12px;color:var(--mute);cursor:pointer;transition:color .25s}
nav.tabs button[aria-selected="true"]{color:var(--fg);font-weight:600}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Листы */
dialog.sheet{border:0;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg);color:var(--fg);
  width:100%;max-width:480px;margin:auto auto 0;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;box-shadow:0 -1px 0 var(--line);will-change:transform}
dialog.sheet::backdrop{background:var(--scrim)}
dialog.sheet[open]{animation:sheetUp .42s var(--ease)}
dialog.sheet[open]::backdrop{animation:fadeIn .42s ease}
dialog.sheet.closing{animation:sheetDown .26s ease-in forwards}
dialog.sheet.closing::backdrop{animation:fadeOut .26s ease-in forwards}
@media (min-width:640px){
  dialog.sheet{margin:auto;border-radius:22px;box-shadow:0 0 0 1px var(--line)}
  dialog.sheet[open]{animation:popIn .36s var(--ease)}
  dialog.sheet.closing{animation:popOut .22s ease-in forwards}
}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:-10px auto 16px}
@media (min-width:640px){.grab{display:none}}
.sheet h3{font-size:20px;font-weight:600;margin:0;outline:none}
.sheet label{display:block;font-size:14px;color:var(--mute);margin:16px 0 6px}
.sheet .meta{color:var(--mute);font-size:14px;margin-top:4px}
.sheet .count{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:-.03em;margin:20px 0 4px;line-height:1}
.sheet .desc{margin-top:16px;line-height:1.55}
.sheet .origin{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);line-height:1.55}
.sheet .olab{font-size:13px;color:var(--mute);margin-bottom:4px}
.drow{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.danger{background:none;border:0;padding:0;margin-top:20px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.danger.armed{color:var(--fg);font-weight:600}
.err{font-size:13px;margin-top:10px;min-height:1.2em}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px) scale(.96);opacity:0;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;transition:opacity .3s,transform .38s var(--ease);pointer-events:none;max-width:90vw;text-align:center;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

@keyframes sheetUp{from{transform:translate3d(0,100%,0)}to{transform:none}}
@keyframes sheetDown{from{transform:none}to{transform:translate3d(0,100%,0)}}
@keyframes popIn{from{opacity:0;transform:translate3d(0,18px,0) scale(.96)}to{opacity:1;transform:none}}
@keyframes popOut{from{opacity:1;transform:none}to{opacity:0;transform:translate3d(0,10px,0) scale(.97)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes flash{0%{background:var(--soft)}100%{background:transparent}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}
}
/* Жидкая капсула прогресса */
:root{--cw1:#2d3136;--cw2:#1b1e22;--cw3:#0b0c0e;--cw4:#2a2d31;--ce1:#f6f6f7;--ce2:#e8e9ea;--ce3:#f1f1f2;--crim:#c4c6c9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cw1:#f6fcff;--cw2:#e2f3fb;--cw3:#b4d0e2;--cw4:#f2faff;--ce1:#191c21;--ce2:#0a0c0e;--ce3:#15171a;--crim:#4b4e53}}
:root[data-theme="dark"]{--cw1:#f6fcff;--cw2:#e2f3fb;--cw3:#b4d0e2;--cw4:#f2faff;--ce1:#191c21;--ce2:#0a0c0e;--ce3:#15171a;--crim:#4b4e53}
.capsule{all:unset;display:block;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;border-radius:999px}
.capsule:focus-visible{outline:2px solid var(--fg);outline-offset:5px}
.capsvg{display:block;width:100%;height:36px;overflow:visible}

/* iOS и веб-приложение */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior:none}
button,.chip,nav.tabs button{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
textarea,input[type=text],input[type=date]{font-size:16px}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:44px;text-align:left}
.backup{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.backup p{margin:0 0 10px;font-size:14px;color:var(--mute)}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sx{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;margin:-4px -4px 0 0;transition:transform .15s,border-color .2s}
.sx:hover{border-color:var(--fg)}
.sx:active{transform:scale(.92)}
.sx svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
dialog.sheet{overscroll-behavior:contain}
html.locked,html.locked body{overflow:hidden}
html.locked .panel,html.locked .scroll{overflow:hidden!important}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">ДМБ</div>
    <div class="tools">
      <button class="tb" id="themeBtn">Тема</button>
      <button class="tb" id="setBtn">Даты</button>
    </div>
  </header>

  <main id="main">
    <!-- Таймер -->
    <div class="panel" id="p-timer" role="tabpanel">
      <div class="hero">
        <button class="big" id="big" title="Нажми, чтобы переключить «осталось» и «прошло»"></button>
        <div class="cap" id="cap"></div>
        <div class="clock" id="clock"></div>
      </div>
      <div class="seg" id="seg" role="group" aria-label="Единицы">
        <span class="pill" id="pill"></span>
        <button data-u="days">Дни</button>
        <button data-u="weeks">Недели</button>
        <button data-u="months">Месяцы</button>
        <button data-u="hours">Часы</button>
        <button data-u="pct">Проценты</button>
      </div>
      <button class="nextcard" id="nextCard" hidden></button>
      <div class="prog">
        <div class="pct" id="pct"></div>
        <button class="capsule" id="capsule" type="button" aria-label="Прогресс службы. Нажми, чтобы повторить анимацию">
          <svg class="capsvg" id="capSvg" aria-hidden="true">
            <defs>
              <linearGradient id="capWaterGrad" x1="0" y1="0.1" x2="1" y2="0.95">
                <stop offset="0%" style="stop-color:var(--cw1)"/><stop offset="35%" style="stop-color:var(--cw2)"/>
                <stop offset="73%" style="stop-color:var(--cw3)"/><stop offset="100%" style="stop-color:var(--cw4)"/>
              </linearGradient>
              <clipPath id="capClip"><rect id="capClipRect"/></clipPath>
            </defs>
            <g clip-path="url(#capClip)">
              <rect id="capEmpty" style="fill:var(--ce2)"/>
              <path id="capWater" d="" fill="url(#capWaterGrad)"/>
              <path id="capEdge" d="" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="1"/>
            </g>
            <rect id="capRim1" fill="none" style="stroke:var(--crim)" stroke-width="1.2"/>
          </svg>
        </button>
        <div class="prow"><span id="sd"></span><span id="ed"></span></div>
        <div class="prow muted"><span id="served"></span><span id="leftd"></span></div>
      </div>
    </div>

    <!-- События -->
    <div class="panel" id="p-events" role="tabpanel" hidden>
      <div class="ptitle">События</div>
      <div class="chips" id="chips">
        <button class="chip" data-f="all">Все</button>
        <button class="chip" data-f="trad">Армейские</button>
        <button class="chip" data-f="month">Месяцы</button>
        <button class="chip" data-f="mine">Мои</button>
      </div>
      <button class="pastbtn" id="pastBtn"></button>
      <div class="scroll" id="tlScroll"><ol class="tl" id="tl"></ol></div>
      <button class="btn wide" id="addBtn">Добавить своё событие</button>
    </div>
  </main>

  <nav class="tabs" role="tablist" id="tabs">
    <span class="ind" id="ind"></span>
    <button role="tab" data-t="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>Таймер</button>
    <button role="tab" data-t="events"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>События</button>
  </nav>
</div>

<!-- Даты -->
<dialog class="sheet" id="dlgDates" aria-labelledby="hDates">
  <div class="grab"></div>
  <div class="shead"><h3 id="hDates" tabindex="-1">Даты службы</h3><button class="sx" data-close aria-label="Закрыть"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>
  <label for="inS">Начало службы</label>
  <input type="date" id="inS">
  <label for="inE">Дата дембеля</label>
  <input type="date" id="inE">
  <div class="err" id="datesErr"></div>
  <div class="drow">
    <button class="btn" id="datesSave">Сохранить</button>
    <button class="btn ghost" data-close>Отмена</button>
  </div>
  <div class="backup">
    <p>Данные хранятся только на этом устройстве. Сохрани копию, чтобы не потерять события.</p>
    <div class="drow" style="margin-top:0">
      <button class="btn ghost" id="exportBtn">Сохранить копию</button>
      <button class="btn ghost" id="importBtn">Восстановить</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
  <button class="danger" id="resetAll">Сбросить всё: даты и события</button>
</dialog>

<!-- Новое событие -->
<dialog class="sheet" id="dlgAdd" aria-labelledby="hAdd">
  <div class="grab"></div>
  <div class="shead"><h3 id="hAdd" tabindex="-1">Своё событие</h3><button class="sx" data-close aria-label="Закрыть"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>
  <label for="evT">Название</label>
  <input type="text" id="evT" placeholder="Например, присяга или отпуск" maxlength="60">
  <label for="evD">Дата</label>
  <input type="date" id="evD">
  <div class="err" id="addErr"></div>
  <div class="drow">
    <button class="btn" id="evAdd">Добавить</button>
    <button class="btn ghost" data-close>Отмена</button>
  </div>
</dialog>

<!-- Карточка события -->
<dialog class="sheet" id="dlgEv" aria-labelledby="hEv">
  <div class="grab"></div>
  <div class="shead"><h3 id="hEv" tabindex="-1"></h3><button class="sx" data-close aria-label="Закрыть"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>
  <div class="meta" id="evMeta"></div>
  <div class="count" id="evCount"></div>
  <div class="muted" id="evCountCap"></div>
  <div class="desc" id="evDesc"></div>
  <div class="origin" id="evOrigin" hidden><div class="olab">Откуда название</div><div id="evOriginT"></div></div>
    <button class="danger" id="evDel" hidden>Удалить событие</button>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const DAY=864e5, KEY='dmb:v1';
const DEF={start:'2026-04-24',end:'2027-04-23',events:[],unit:'days',mode:'left',theme:null,filter:'all',tab:'timer'};
const clone=o=>JSON.parse(JSON.stringify(o));
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(clone(DEF),JSON.parse(r));}catch(e){}return clone(DEF);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

const $=id=>document.getElementById(id);
const P=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const K=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dayDiff=(a,b)=>Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/DAY);
const pl=(n,a,b,c)=>{n=Math.abs(Math.trunc(n))%100;const r=n%10;if(n>10&&n<20)return c;if(r>1&&r<5)return b;if(r===1)return a;return c;};
const nf=new Intl.NumberFormat('ru-RU');
const dn=n=>nf.format(n)+' '+pl(n,'день','дня','дней');
const isOne=n=>{n=Math.abs(Math.trunc(n))%100;return n%10===1&&n!==11;};
const ostalos=n=>isOne(n)?'Остался':'Осталось';
const proshlo=n=>isOne(n)?'Прошёл':'Прошло';
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const fd=d=>d.getDate()+' '+MG[d.getMonth()]+' '+d.getFullYear();
const p2=n=>String(n).padStart(2,'0');
const rel=diff=>diff===0?'сегодня':diff<0?dn(-diff)+' назад':'через '+dn(diff);

let start,end,totalDays,lastDayKey='',showPast=false,intro=!reduced,MSL=[];

/* ---------- Анимации ---------- */
function animIn(el,from,dur){if(reduced||!el.animate)return;
  el.animate([Object.assign({opacity:0},from),{opacity:1,transform:'translate3d(0,0,0)'}],{duration:dur||380,easing:'cubic-bezier(.2,.8,.2,1)'});}
function swapHero(){animIn($('big'),{transform:'translate3d(0,14px,0)'});animIn($('cap'),{transform:'translate3d(0,8px,0)'});animIn($('clock'),{transform:'translate3d(0,8px,0)'});}

/* ---------- Вкладки ---------- */
const TABS=['timer','events'];
function showTab(t,animate){
  const prev=S.tab, i=TABS.indexOf(t), dir=Math.sign(i-TABS.indexOf(prev));
  S.tab=t;save();
  TABS.forEach(x=>{$('p-'+x).hidden=x!==t;});
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
  $('ind').style.transform='translateX('+(i*100)+'%)';
  if(t==='timer')requestAnimationFrame(()=>{movePill();capLayout();});
  if(animate&&dir)animIn($('p-'+t),{transform:'translate3d('+(dir*28)+'px,0,0)'},340);
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.t!==S.tab)showTab(b.dataset.t,true);});

// Свайп между вкладками
let tx=0,ty=0,tOk=false;
$('main').addEventListener('touchstart',e=>{
  const el=e.target;tOk=!el.closest('textarea,input,.chips,.seg');
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
$('main').addEventListener('touchend',e=>{
  if(!tOk)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const i=TABS.indexOf(S.tab)+(dx<0?1:-1);if(i>=0&&i<TABS.length)showTab(TABS[i],true);},{passive:true});

/* ---------- Листы ---------- */
function lockBg(on){
  document.documentElement.classList.toggle('locked',on);
  const a=document.querySelector('.app');
  if(on)a.setAttribute('inert','');else a.removeAttribute('inert');
}
function openSheet(d){d.classList.remove('closing');lockBg(true);d.showModal();d.querySelector('h3').focus({preventScroll:true});}
function closeSheet(d){
  if(!d.open||d.classList.contains('closing'))return;
  if(reduced){d.close();return;}
  d.classList.add('closing');
  d.addEventListener('animationend',()=>{d.classList.remove('closing');d.close();},{once:true});
}
document.querySelectorAll('dialog.sheet').forEach(d=>{
  d.addEventListener('cancel',e=>{e.preventDefault();closeSheet(d);});
  d.addEventListener('close',()=>lockBg(false));
  // жест по затемнённому фону не должен прокручивать страницу под окном
  d.addEventListener('touchmove',e=>{
    if(e.target!==d)return;
    const r=d.getBoundingClientRect(),t=e.touches[0];
    if(t.clientX<r.left||t.clientX>r.right||t.clientY<r.top||t.clientY>r.bottom)e.preventDefault();
  },{passive:false});
  d.addEventListener('click',e=>{if(e.target===d)closeSheet(d);});
  d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSheet(d));
});

/* ---------- Тема ---------- */
function applyTheme(){if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{
    if(!m.dataset.orig)m.dataset.orig=m.getAttribute('media')||'';
    if(S.theme){m.removeAttribute('media');m.content=S.theme==='dark'?'#000000':'#ffffff';}
    else{m.setAttribute('media',m.dataset.orig);m.content=m.dataset.orig.includes('dark')?'#000000':'#ffffff';}});
  $('themeBtn').textContent=S.theme==='dark'?'Тёмная':S.theme==='light'?'Светлая':'Тема: авто';}

/* ---------- Переключатель единиц ---------- */
function movePill(){
  const b=document.querySelector('#seg button[data-u="'+S.unit+'"]'),pill=$('pill');
  document.querySelectorAll('#seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  if(!b.offsetWidth)return;
  pill.style.width=b.offsetWidth+'px';pill.style.transform='translateX('+b.offsetLeft+'px)';
}
addEventListener('resize',movePill);

function monthsBetween(a,b){
  const at=m=>new Date(a.getFullYear(),a.getMonth()+m,a.getDate(),a.getHours(),a.getMinutes(),a.getSeconds());
  let m=0;while(at(m+1)<=b)m++;
  const s=at(m),n=at(m+1);
  return{whole:m,frac:m+(b-s)/(n-s),days:Math.floor((b-s)/DAY)};
}

/* ---------- Этапы ---------- */
function milestones(){
  const T=dayDiff(start,end),L=[];
  const add=(t,date,kind,desc,origin)=>{if(date>=start&&date<=end)L.push({t,date,kind,desc,origin});};
  const fs=n=>addD(start,n),be=n=>addD(end,-n);
  for(let m=1;;m++){const d=new Date(start.getFullYear(),start.getMonth()+m,start.getDate());if(d>=end)break;
    add(m+' '+pl(m,'месяц','месяца','месяцев')+' службы',d,'month','Ровно '+m+' '+pl(m,'месяц','месяца','месяцев')+' с начала службы.');}
  add('Сто дней службы',fs(100),'trad','Первая сотня дней позади. По традиции в этот день меняют бляху на ремне.');
  add('Малые топорики',fs(77),'trad','77 дней службы позади. В некоторых списках их называют «звенящие топорики». Малые даты обычно считают от начала службы, большие — до её конца.','Скорее всего, от вида числа: семёрки похожи на топорики.');
  add('Малые матрёшки',fs(88),'trad','88 дней службы позади. Малые матрёшки считают от начала службы, большие — до дома.','Скорее всего, от вида числа: восьмёрки похожи на матрёшек.');
  add('Малый заборчик',fs(111),'trad','111 дней службы позади. Большой заборчик будет, когда до дома останется 111 дней.','Скорее всего, от вида числа: три единицы похожи на штакетины забора.');
  add('Гуси-лебеди',be(222),'trad','222 дня до дома. Эту дату отмечают дважды: когда до дома 222 дня и когда отслужено 222 дня.','Скорее всего, от вида числа: двойки похожи на силуэты плывущих птиц.');
  add('Гуси-лебеди, отслужено',fs(222),'trad','222 дня службы позади. Вторые гуси-лебеди: первые были, когда до дома оставалось 222 дня.','Скорее всего, от вида числа: двойки похожи на силуэты плывущих птиц.');
  add('Четверть службы',fs(Math.round(T*.25)),'trad','Позади четверть срока.');
  add('300 дней до дома',be(300),'trad','Обратный отсчёт пошёл на сотни.');
  add('Малая розетка',be(220),'trad','220 дней до дома. У розеток счёт наоборот, чем у заборчиков: малая считается до дома, большая от начала службы. В некоторых списках малую розетку отмечают за 200 дней.','Скорее всего, от напряжения в бытовой розетке: 220 вольт.');
  add('200 дней до дома',be(200),'trad','Осталось двести дней.');
  add('Экватор',fs(Math.round(T*.5)),'trad','Половина службы позади.','Как пересечение экватора: середина пути.');
  add('200 дней службы',fs(200),'trad','Двести дней службы позади.');
  add('Большая розетка',fs(220),'trad','220 дней службы позади. Малая розетка была, когда до дома оставалось 220 дней.','Скорее всего, от напряжения в бытовой розетке: 220 вольт.');
  add('Три четверти службы',fs(Math.round(T*.75)),'trad','Осталась последняя четверть.');
  add('Большой заборчик',be(111),'trad','111 дней до дома. Малый заборчик был на 111-й день службы.','Скорее всего, от вида числа: три единицы похожи на штакетины забора.');
  add('Большие матрёшки',be(88),'trad','88 дней до дома.','Скорее всего, от вида числа: восьмёрки похожи на матрёшек.');
  add('Большие топорики',be(77),'trad','77 дней до дома.','Скорее всего, от вида числа: семёрки похожи на топорики.');
  add('Сто дней до дома',be(100),'trad','Стодневка, одна из главных армейских дат. По традиции дембеля с этого времени отказываются от масла.','Классическая стодневка — «сто дней до приказа»: за 100 дней до приказа министра обороны об увольнении. Здесь она посчитана как 100 дней до даты дембеля, потому что дата приказа приложению неизвестна.');
  add('300 дней службы',fs(300),'trad','Триста дней службы позади.');
  add('Полтинник',be(50),'trad','50 дней до дома. По армейской присказке пора ставить водку в холодильник.','«Полтинник» в разговорной речи — пятьдесят.');
  add('Месяц до дома',be(30),'trad','Последний месяц.');
  add('Дембельская пачка',be(20),'trad','20 дней до дома. Пачку сигарет подписывают по дням и выкуривают по одной за вечер, чтобы последняя пришлась на день дембеля. Некурящие делают то же с коробкой конфет. Иногда такую пачку дембелю оформляют младшие сослуживцы.','В пачке 20 сигарет, по одной на каждый оставшийся день.');
  add('Космос',be(10),'trad','10 дней до дома.','Возможно, отсылка к обратному отсчёту перед стартом ракеты: 10, 9, 8…');
  add('Неделя до дома',be(7),'trad','Последняя неделя.');
  const SV='Три последних дня — три сигнала светофора: красный за 3 дня, жёлтый за 2, зелёный за 1. Зелёный значит, что дорога домой открыта.';
  add('Светофор: красный',be(3),'trad','3 дня до дома.',SV);
  add('Светофор: жёлтый',be(2),'trad','2 дня до дома.',SV);
  add('Светофор: зелёный',be(1),'trad','Последний день. Завтра домой.',SV);
  for(let y=start.getFullYear()+1;y<=end.getFullYear();y++){const d=new Date(y,0,1);if(d>start&&d<end)add('Новый год '+y,d,'trad','Новый год в армии.');}
  add('Дембель',end,'trad','Служба окончена. Домой.');
  S.events.forEach(e=>{const d=P(e.date);L.push({t:e.title,date:d,kind:'mine',id:e.id,desc:'Твоё событие.'});});
  return L.sort((a,b)=>a.date-b.date||(a.kind==='month')-(b.kind==='month'));
}

/* ---------- Основное ---------- */
function setup(){
  start=P(S.start);end=P(S.end);totalDays=dayDiff(start,end)+1;
  $('sd').textContent=fd(start);$('ed').textContent=fd(end);
  MSL=milestones();lastDayKey='';
  renderTL(false);renderChips();tick();movePill();
}

function heroValues(now){
  const total=end-start,done=Math.min(Math.max(now-start,0),total),left=total-done;
  const v=S.mode==='left'?left:done,tail=S.mode==='left'?' до дома':' службы позади';
  if(now<start){const n=Math.ceil((start-now)/DAY);return{txt:nf.format(n),cap:pl(n,'день','дня','дней')+' до начала службы',clock:'',num:n};}
  if(left<=0&&S.mode==='left')return{txt:'0',cap:'Служба окончена. Ты дома',clock:'',num:0};
  if(S.unit==='days'){const n=Math.floor(v/DAY),r=v-n*DAY;
    return{txt:nf.format(n),num:n,cap:pl(n,'день','дня','дней')+tail,clock:'и '+p2(Math.floor(r/36e5))+':'+p2(Math.floor(r%36e5/6e4))+':'+p2(Math.floor(r%6e4/1e3))};}
  if(S.unit==='weeks'){const n=v/(7*DAY),w=Math.floor(n),d=Math.floor((v-w*7*DAY)/DAY);
    return{txt:n.toFixed(1).replace('.',','),cap:'недели'+tail,clock:w+' нед. '+d+' дн.'};}
  if(S.unit==='months'){const r=S.mode==='left'?monthsBetween(now,end):monthsBetween(start,now);
    return{txt:r.frac.toFixed(1).replace('.',','),cap:'месяца'+tail,clock:r.whole+' мес. '+r.days+' дн.'};}
  if(S.unit==='hours'){const n=Math.floor(v/36e5);
    return{txt:nf.format(n),cap:pl(n,'час','часа','часов')+tail,clock:'и '+p2(Math.floor(v%36e5/6e4))+':'+p2(Math.floor(v%6e4/1e3))};}
  return{txt:(v/total*100).toFixed(1).replace('.',',')+'%',cap:S.mode==='left'?'службы осталось':'службы позади',clock:''};
}
function setBig(txt){const b=$('big');if(b.textContent===txt)return;b.textContent=txt;b.style.setProperty('--len',Math.max(txt.length,2));}

/* ---------- Жидкая капсула ---------- */
const CAP_H=36,CAP_PAD=2.8,CAP_AMP=4.7;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let capW=0,capShown=0,capFrame=0,capIntro=false,lastPct=0;
function capSet(id,o){const e=$(id);for(const k in o)e.setAttribute(k,o[k]);}
function capDraw(p,amp,phase){
  capShown=clamp(p,0,100);
  if(!capW)return;
  if(capShown<0.001){$('capWater').setAttribute('d','');$('capEdge').setAttribute('d','');return;}
  const L=CAP_PAD,R=capW-CAP_PAD,T=CAP_PAD,B=CAP_H-CAP_PAD,front=L+(R-L)*capShown/100,pts=[];
  for(let y=T;y<=B+0.01;y+=1.1){
    const n=(y-(T+B)/2)/((B-T)/2);
    const rip=Math.sin(y/3.6+phase)+0.28*Math.sin(y/1.6+phase*1.4);
    pts.push((front+amp*(rip+n*0.3)).toFixed(2)+' '+y.toFixed(2));
  }
  $('capEdge').setAttribute('d',capShown>=99.9?'':'M '+pts.join(' L '));
  $('capWater').setAttribute('d','M '+L+' '+T+' L '+pts.join(' L ')+' L '+L+' '+B+' Z');
}
function capPlay(from,to,dur){
  cancelAnimationFrame(capFrame);capFrame=0;
  if(!capW)return;
  if(reduced){capDraw(to,0,0);return;}
  const t0=performance.now();
  (function f(now){
    const t=clamp((now-t0)/dur,0,1),e=1-Math.pow(1-t,3);
    capDraw(from+(to-from)*e,CAP_AMP*(1-t)*(1-t)*Math.sin(t*Math.PI),t*19);
    if(t<1)capFrame=requestAnimationFrame(f);else{capDraw(to,0,0);capFrame=0;}
  })(t0);
}
function capLayout(){
  const w=Math.round($('capsule').clientWidth);
  if(!w)return;                       // вкладка «Таймер» скрыта
  if(w!==capW){
    capW=w;const H=CAP_H,ih=H-2*CAP_PAD,iw=w-2*CAP_PAD;
    $('capSvg').setAttribute('viewBox','0 0 '+w+' '+H);
    capSet('capClipRect',{x:CAP_PAD,y:CAP_PAD,width:iw,height:ih,rx:ih/2});
    capSet('capEmpty',{x:CAP_PAD,y:CAP_PAD,width:iw,height:ih});
    capSet('capRim1',{x:1,y:1,width:w-2,height:H-2,rx:(H-2)/2});
    if(!capFrame)capDraw(capShown,0,0);
  }
  if(!capIntro){capIntro=true;capPlay(0,lastPct,1500);}   // первое появление на экране
}
function capUpdate(p){
  lastPct=p;
  if(!capIntro||capFrame)return;
  if(Math.abs(p-capShown)>0.0002)capDraw(p,0,0);
}
$('capsule').onclick=()=>capPlay(0,lastPct,1600);
if(window.ResizeObserver)new ResizeObserver(capLayout).observe($('capsule'));
else addEventListener('resize',capLayout);

function tick(){
  const now=new Date(),total=end-start,done=Math.min(Math.max(now-start,0),total),left=total-done;
  const h=heroValues(now);
  if(!intro)setBig(h.txt);
  $('cap').textContent=h.cap;$('clock').textContent=h.clock;
  const pct=done/total*100;
  $('pct').textContent=pct.toFixed(6).replace('.',',')+' %';
  capUpdate(pct);
  {const n=Math.floor(done/DAY);$('served').textContent=proshlo(n)+' '+dn(n);}
  {const n=Math.ceil(left/DAY);$('leftd').textContent=ostalos(n)+' '+dn(n);}
  const k=K(now);if(k!==lastDayKey){if(lastDayKey){renderTL(false);}lastDayKey=k;renderNext();}
}

function runIntro(){
  const h=heroValues(new Date());
  if(!intro||h.num===undefined||S.tab!=='timer'){intro=false;tick();return;}
  const target=h.num,t0=performance.now(),dur=1100;
  (function f(t){const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,4);
    setBig(nf.format(Math.round(target*e)));
    if(p<1)requestAnimationFrame(f);else{intro=false;tick();}})(t0);
}

function renderNext(){
  const now=new Date(),n=MSL.find(m=>dayDiff(now,m.date)>=0),c=$('nextCard');
  if(!n){c.hidden=true;return;}
  c.hidden=false;c.innerHTML='';
  const sm=document.createElement('small');sm.textContent='Следующее событие';
  const row=document.createElement('div');row.className='nrow';
  const st=document.createElement('strong');st.textContent=n.t;
  const r=document.createElement('span');r.className='r';r.textContent=rel(dayDiff(now,n.date));
  row.append(st,r);c.append(sm,row);c.onclick=()=>openEvent(n);
}

/* ---------- События ---------- */
function renderChips(){document.querySelectorAll('#chips .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.f===S.filter));}
document.querySelectorAll('#chips .chip').forEach(c=>c.onclick=()=>{if(S.filter===c.dataset.f)return;S.filter=c.dataset.f;save();renderChips();renderTL(true);$('tlScroll').scrollTop=0;});
$('pastBtn').onclick=()=>{showPast=!showPast;renderTL(true);};

function renderTL(animate,flashId){
  const ol=$('tl'),now=new Date();ol.innerHTML='';
  const list=MSL.filter(m=>S.filter==='all'||m.kind===S.filter);
  const past=list.filter(m=>dayDiff(now,m.date)<0);
  $('pastBtn').hidden=!past.length;
  $('pastBtn').textContent=showPast?'Скрыть пройденные':'Показать пройденные ('+past.length+')';
  const shown=showPast?list:list.filter(m=>dayDiff(now,m.date)>=0);
  if(!shown.length){const p=document.createElement('li');p.className='empty';p.style.border='0';
    p.textContent=S.filter==='mine'?'Своих событий пока нет. Добавь присягу, отпуск или день рождения.':'Все события в этом разделе позади.';
    ol.appendChild(p);return;}
  let nextMarked=false,flashEl=null;
  shown.forEach((m,idx)=>{
    const li=document.createElement('li'),diff=dayDiff(now,m.date);
    if(diff<0)li.classList.add('past');else if(!nextMarked){li.classList.add('next');nextMarked=true;}
    if(animate&&!reduced&&idx<14){li.classList.add('in');li.style.animationDelay=idx*26+'ms';}
    if(flashId&&m.id===flashId){li.classList.add('flash');flashEl=li;}
    const b=document.createElement('button');b.className='row';
    const t=document.createElement('div');t.className='t';t.textContent=m.t;
    const d=document.createElement('div');d.className='d';d.textContent=fd(m.date);
    const s=document.createElement('div');s.className='s';s.textContent=diff<0?'позади':rel(diff);
    b.append(t,s,d);b.onclick=()=>openEvent(m);
    li.appendChild(b);ol.appendChild(li);
  });
  if(flashEl)flashEl.scrollIntoView({block:'center',behavior:reduced?'auto':'smooth'});
}

let curEv=null;
function openEvent(m){
  curEv=m;const diff=dayDiff(new Date(),m.date);
  $('hEv').textContent=m.t;
  $('evMeta').textContent=fd(m.date)+', день '+(dayDiff(start,m.date)+1)+' из '+totalDays;
  $('evCount').textContent=diff===0?'Сегодня':nf.format(Math.abs(diff));
  $('evCountCap').textContent=diff===0?'':diff>0?pl(diff,'день','дня','дней')+(isOne(diff)?' остался':' осталось'):pl(-diff,'день','дня','дней')+' назад';
  $('evDesc').textContent=m.desc||'';
  $('evOrigin').hidden=!m.origin;$('evOriginT').textContent=m.origin||'';
  $('evDel').hidden=!m.id;$('evDel').classList.remove('armed');$('evDel').textContent='Удалить событие';
  openSheet($('dlgEv'));
}
$('evDel').onclick=()=>{const b=$('evDel');
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Нажми ещё раз, чтобы удалить';return;}
  S.events=S.events.filter(e=>e.id!==curEv.id);save();MSL=milestones();renderTL(false);renderNext();
  closeSheet($('dlgEv'));toast('Событие удалено');};

$('addBtn').onclick=()=>{$('evT').value='';$('evD').value='';$('addErr').textContent='';openSheet($('dlgAdd'));};
$('evAdd').onclick=()=>{
  const t=$('evT').value.trim(),d=$('evD').value;
  if(!t||!d){$('addErr').textContent='Укажи название и дату';return;}
  if(P(d)<start||P(d)>end){$('addErr').textContent='Дата должна быть в пределах службы: '+fd(start)+' – '+fd(end);return;}
  const id=Date.now().toString(36);
  S.events.push({id,title:t,date:d});save();MSL=milestones();
  if(S.filter!=='all'&&S.filter!=='mine'){S.filter='mine';renderChips();}
  if(dayDiff(new Date(),P(d))<0)showPast=true;
  closeSheet($('dlgAdd'));
  if(S.tab!=='events')showTab('events',true);
  renderTL(false,id);renderNext();
  toast('Событие добавлено');
};

/* ---------- Управление ---------- */
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{if(S.unit===b.dataset.u)return;S.unit=b.dataset.u;save();movePill();intro=false;tick();swapHero();});
$('big').onclick=()=>{S.mode=S.mode==='left'?'done':'left';save();intro=false;tick();swapHero();};
$('themeBtn').onclick=()=>{S.theme=S.theme===null?'light':S.theme==='light'?'dark':null;save();applyTheme();};

$('setBtn').onclick=()=>{$('inS').value=S.start;$('inE').value=S.end;$('datesErr').textContent='';
  $('resetAll').classList.remove('armed');$('resetAll').textContent='Сбросить всё: даты и события';openSheet($('dlgDates'));};
$('datesSave').onclick=()=>{
  const s=$('inS').value,e=$('inE').value;
  if(!s||!e||P(e)<=P(s)){$('datesErr').textContent='Дата дембеля должна быть позже даты начала службы';return;}
  S.start=s;S.end=e;save();closeSheet($('dlgDates'));setup();swapHero();capPlay(0,lastPct,1400);toast('Даты сохранены');
};
$('resetAll').onclick=()=>{const b=$('resetAll');
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Нажми ещё раз: всё будет удалено';return;}
  S=clone(DEF);save();applyTheme();closeSheet($('dlgDates'));setup();showTab('timer',false);swapHero();toast('Всё сброшено');};

/* ---------- Резервная копия ---------- */
$('exportBtn').onclick=async()=>{
  const data=JSON.stringify({app:'dmb',version:1,saved:new Date().toISOString(),state:S},null,2);
  const name='dmb-backup-'+K(new Date())+'.json';
  try{
    const file=new File([data],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Копия ДМБ'});toast('Копия сохранена');return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  toast('Копия сохранена');
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text()),st=j&&j.state;
    if(!st||!/^\d{4}-\d{2}-\d{2}$/.test(st.start)||!/^\d{4}-\d{2}-\d{2}$/.test(st.end))throw 0;
    S=Object.assign(clone(DEF),st);save();applyTheme();closeSheet($('dlgDates'));setup();showTab(S.tab,false);toast('Данные восстановлены');
  }catch(err){$('datesErr').textContent='Файл не похож на копию ДМБ-таймера';}
};

let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400);}

// Если окно просмотра не сообщает свою высоту, задаём её по экрану устройства
function fitHeight(){
  const app=document.querySelector('.app');
  if(window.innerHeight<400){app.style.height=Math.max((screen.height||700)-160,500)+'px';}
  else app.style.height='';
  movePill();
}
addEventListener('resize',fitHeight);
fitHeight();

applyTheme();
if(!TABS.includes(S.tab))S.tab='timer';
showTab(S.tab,false);
setup();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(movePill);
runIntro();
setInterval(tick,1000);
// Пересчёт после возврата в приложение (iOS замораживает таймеры в фоне)
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();fitHeight();}});
// Офлайн-режим
if('serviceWorker' in navigator&&location.protocol==='https:'){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
